name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Linux verifier isolation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ephemeral CI runner: allow bwrap's unprivileged user namespace.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Check leaderboard selection
        run: node tests/test_leaderboard.cjs

      - name: Verify harness gold solutions
        run: uv run python .github/scripts/verify_gold_with_annotations.py

      - name: Build package
        run: uv build

      - name: Check package contents
        run: uv run python .github/scripts/check_package_contents.py
